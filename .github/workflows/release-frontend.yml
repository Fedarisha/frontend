name: Release frontend

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run start:build
      - name: Create release archive
        run: zip -qr remnawave-frontend.zip dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" remnawave-frontend.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" remnawave-frontend.zip --generate-notes
          fi
