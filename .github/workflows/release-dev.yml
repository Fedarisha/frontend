name: Release frontend dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-dev-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run start:build
      - name: Create release archive
        run: zip -qr remnawave-frontend.zip dist
      - name: Publish development archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build remnawave-frontend.zip --clobber
          else
            gh release create dev-build remnawave-frontend.zip --target "$GITHUB_SHA" --prerelease --title 'Development build'
          fi
          gh release edit dev-build --notes "Built from $GITHUB_SHA"
